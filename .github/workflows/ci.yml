name: CI Pipeline

on:
  push:
    branches:
      - feature/index-page
      - feature/contact-page
      - feature/admissions-page
      - feature/exams-page
      - feature/notices-page
      - develop
  pull_request:
    branches:
      - develop

jobs:
  lint-build:
    name: Lint & Build Website
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run HTMLHint
        run: npx htmlhint "src/*.html"

      - name: Run Stylelint
        run: npx stylelint "styles/*.css"

      - name: Build with Parcel
        run: npx parcel build src/*.html --dist-dir dist

  docker-build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: lint-build
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker Image
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/uni-notice-board:latest .

      - name: Push Docker Image
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/uni-notice-board:latest