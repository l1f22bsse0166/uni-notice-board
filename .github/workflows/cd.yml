name: CD Pipeline

on:
  push:
    branches:
      - develop

jobs:
  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    environment: development

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Pull latest Docker image
        run: |
          # Replace 'latests_3' with the tag of your latest image
          docker pull docker.io/${{ secrets.DOCKERHUB_USERNAME }}/uni-notice-board:latests_3

      - name: Trigger Render Deployment
        run: |
          curl -X POST "${{ secrets.RENDER_CALLBACK_URL }}"

      - name: Verify deployment trigger
        run: echo "Render deployment triggered successfully 🚀"
